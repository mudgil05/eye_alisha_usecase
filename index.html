<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');
  
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080c10;--bg2:#0d1219;--bg3:#121a24;--surface:#1a2535;--surface2:#1f2d42;
    --border:#2a3d55;--border2:#3a5070;
    --teal:#00d4aa;--teal2:#00a882;--teal3:#007a5e;
    --amber:#f5a623;--amber2:#c4821a;
    --red:#e84545;--red2:#b83535;
    --blue:#4da8ff;--blue2:#2d7fcc;
    --purple:#a78bfa;--purple2:#7c5ec4;
    --green:#4ade80;
    --text:#e8f0fe;--text2:#9ab0cc;--text3:#5a7a99;
    --mono:'Space Mono',monospace;
    --sans:'DM Sans',sans-serif;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:600px;overflow-x:hidden}
  
  /* Layout */
  .app{display:flex;flex-direction:column;height:100%;min-height:620px}
  .header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{font-family:var(--mono);font-size:11px;color:var(--teal);letter-spacing:2px;text-transform:uppercase;font-weight:700}
  .logo span{color:var(--text3)}
  .main{display:flex;flex:1;min-height:0}
  .sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
  .content{flex:1;overflow:auto;padding:0}
  
  /* Nav */
  .nav-section{padding:12px 0 4px}
  .nav-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;padding:0 14px 6px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;color:var(--text2);font-size:13px}
  .nav-item:hover{background:var(--surface);color:var(--text)}
  .nav-item.active{background:var(--surface);color:var(--teal);border-left-color:var(--teal)}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0}
  .nav-item.active .nav-dot{background:var(--teal)}
  
  /* Mode tabs */
  .mode-tabs{display:flex;gap:4px;margin-left:auto}
  .mode-tab{font-family:var(--mono);font-size:10px;padding:4px 10px;border:1px solid var(--border);border-radius:3px;cursor:pointer;color:var(--text3);background:transparent;letter-spacing:1px;transition:all .15s}
  .mode-tab.active,.mode-tab:hover{border-color:var(--teal);color:var(--teal);background:rgba(0,212,170,.05)}
  
  /* Panel */
  .panel{padding:20px 24px;max-width:900px}
  .panel-title{font-family:var(--mono);font-size:13px;color:var(--teal);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
  .panel-sub{color:var(--text2);font-size:12px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px}
  
  /* Eye SVG container */
  .eye-stage{display:flex;justify-content:center;align-items:flex-start;gap:24px;flex-wrap:wrap}
  .eye-svg-wrap{position:relative;flex-shrink:0}
  .info-card{flex:1;min-width:240px;max-width:360px}
  .info-card h3{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .info-card p{color:var(--text2);font-size:13px;line-height:1.7;margin-bottom:10px}
  .badge{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:2px;letter-spacing:1px;margin-right:4px;margin-bottom:4px}
  .badge-teal{background:rgba(0,212,170,.1);color:var(--teal);border:1px solid var(--teal3)}
  .badge-amber{background:rgba(245,166,35,.1);color:var(--amber);border:1px solid var(--amber2)}
  .badge-red{background:rgba(232,69,69,.1);color:var(--red);border:1px solid var(--red2)}
  .badge-purple{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid var(--purple2)}
  
  /* Structure grid */
  .struct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
  .struct-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;cursor:pointer;transition:all .2s}
  .struct-card:hover,.struct-card.sel{border-color:var(--teal);background:var(--surface2)}
  .struct-card.sel{box-shadow:0 0 0 1px var(--teal3) inset}
  .struct-card-title{font-family:var(--mono);font-size:10px;color:var(--teal);letter-spacing:1px;margin-bottom:4px}
  .struct-card-body{color:var(--text2);font-size:12px;line-height:1.5}
  
  /* Layer stack */
  .layer-stack{display:flex;flex-direction:column;gap:2px;margin:16px 0}
  .layer-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:4px;cursor:pointer;transition:all .15s;border:1px solid transparent}
  .layer-row:hover{border-color:var(--border2);background:var(--surface)}
  .layer-row.active{border-color:var(--teal);background:var(--surface2)}
  .layer-color{width:10px;height:10px;border-radius:2px;flex-shrink:0}
  .layer-name{font-size:13px;font-weight:500;min-width:160px}
  .layer-detail{font-size:12px;color:var(--text3);flex:1}
  .layer-tag{font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:2px}
  
  /* Disease cards */
  .disease-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
  .disease-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px;cursor:pointer;transition:all .2s;border-left:3px solid var(--border)}
  .disease-card:hover,.disease-card.sel{border-left-color:var(--red);background:var(--surface2)}
  .disease-card-cat{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
  .disease-card-name{font-size:13px;font-weight:600;margin-bottom:6px}
  .disease-card-desc{font-size:12px;color:var(--text2);line-height:1.5}
  
  /* Surgical steps */
  .surg-steps{display:flex;flex-direction:column;gap:2px;margin-top:16px}
  .surg-step{display:flex;gap:14px;padding:12px;border:1px solid var(--border);border-radius:5px;cursor:pointer;transition:all .15s}
  .surg-step:hover,.surg-step.active{border-color:var(--amber);background:rgba(245,166,35,.04)}
  .step-num{font-family:var(--mono);font-size:11px;color:var(--amber);min-width:32px;padding-top:2px}
  .step-content-inner{}
  .step-title{font-size:13px;font-weight:500;margin-bottom:3px}
  .step-note{font-size:12px;color:var(--text2)}
  .step-warn{font-size:11px;color:var(--red);margin-top:4px;font-family:var(--mono)}
  
  /* Pathway viz */
  .pathway{display:flex;flex-direction:column;gap:0;margin:16px 0}
  .pw-node{display:flex;align-items:flex-start;gap:12px}
  .pw-line-col{display:flex;flex-direction:column;align-items:center;width:24px;flex-shrink:0}
  .pw-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--teal);background:var(--bg);flex-shrink:0;margin-top:4px}
  .pw-dot.active{background:var(--teal)}
  .pw-seg{width:2px;flex:1;background:linear-gradient(var(--teal3),var(--border));min-height:20px}
  .pw-body{padding:0 0 16px}
  .pw-title{font-size:13px;font-weight:500;color:var(--text)}
  .pw-desc{font-size:12px;color:var(--text2);margin-top:2px}
  
  /* Nerve map */
  .nerve-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
  .nerve-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;border-top:2px solid}
  .nc-purple{border-top-color:var(--purple)}
  .nc-teal{border-top-color:var(--teal)}
  .nc-amber{border-top-color:var(--amber)}
  .nc-blue{border-top-color:var(--blue)}
  .nc-red{border-top-color:var(--red)}
  .nerve-id{font-family:var(--mono);font-size:11px;margin-bottom:4px}
  .nerve-name{font-size:13px;font-weight:600;margin-bottom:6px}
  .nerve-rows{display:flex;flex-direction:column;gap:4px}
  .nerve-row{display:flex;gap:8px;font-size:12px}
  .nerve-label{color:var(--text3);min-width:80px}
  .nerve-val{color:var(--text2)}
  
  /* Clinical case */
  .case-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:14px}
  .case-hx{font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.8;margin-bottom:10px}
  .case-question{font-size:14px;font-weight:500;color:var(--amber);margin-bottom:12px}
  .case-opts{display:flex;flex-direction:column;gap:6px}
  .case-opt{padding:9px 14px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:13px;transition:all .15s;text-align:left;background:transparent;color:var(--text);width:100%}
  .case-opt:hover{border-color:var(--blue);background:rgba(77,168,255,.05)}
  .case-opt.correct{border-color:var(--green);background:rgba(74,222,128,.07);color:var(--green)}
  .case-opt.wrong{border-color:var(--red);background:rgba(232,69,69,.06);color:var(--red)}
  .case-feedback{margin-top:12px;padding:10px 14px;border-radius:4px;font-size:13px;line-height:1.6}
  .feedback-correct{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);color:var(--green)}
  .feedback-wrong{background:rgba(232,69,69,.08);border:1px solid rgba(232,69,69,.25);color:#ff8080}
  .next-btn{margin-top:10px;padding:8px 18px;background:transparent;border:1px solid var(--teal);color:var(--teal);border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:1px;transition:all .15s}
  .next-btn:hover{background:rgba(0,212,170,.1)}
  
  /* Scroll helpers */
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  
  /* Responsive for small iframe */
  @media(max-width:600px){.sidebar{width:160px}.panel{padding:14px 16px}}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<div class="header">
  <div class="logo">Wolff <span>//</span> Ophthalmology Atlas <span>// 8th Ed</span></div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-anatomy" onclick="setMode('anatomy')">ANATOMY</button>
    <button class="mode-tab" id="tab-surgical" onclick="setMode('surgical')">SURGICAL</button>
    <button class="mode-tab" id="tab-disease" onclick="setMode('disease')">DISEASE</button>
    <button class="mode-tab" id="tab-clinical" onclick="setMode('clinical')">CLINICAL</button>
  </div>
</div>

<div class="main">
<!-- SIDEBAR -->
<div class="sidebar" id="sidebar"></div>

<!-- CONTENT -->
<div class="content" id="content-area"></div>
</div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const ANATOMY_SECTIONS = [
  {id:'orbit',label:'Bony Orbit',icon:'○'},
  {id:'eyeball',label:'Eyeball Layers',icon:'◉'},
  {id:'anterior',label:'Anterior Segment',icon:'◑'},
  {id:'posterior',label:'Posterior Segment',icon:'◐'},
  {id:'adnexa',label:'Ocular Adnexa',icon:'◫'},
  {id:'eom',label:'Extraocular Muscles',icon:'⊞'},
  {id:'nerves',label:'Cranial Nerves',icon:'⌾'},
  {id:'pathway',label:'Visual Pathway',icon:'→'},
];

const SURGICAL_SECTIONS = [
  {id:'phaco',label:'Phacoemulsification'},
  {id:'vitrect',label:'Vitrectomy'},
  {id:'lasik',label:'LASIK'},
  {id:'trabeculect',label:'Trabeculectomy'},
];

const DISEASE_SECTIONS = [
  {id:'corneal',label:'Corneal Disease'},
  {id:'lens-d',label:'Lens / Cataract'},
  {id:'glaucoma',label:'Glaucoma'},
  {id:'retinal',label:'Retinal Disease'},
  {id:'optic',label:'Optic Nerve'},
];

const CLINICAL_CASES = [
  {
    hx:`CC: 65 y/o M, sudden onset flashing lights + curtain falling over right eye × 2 hours.
VA: 6/60 right, 6/6 left.
IOP: 12 mmHg (R), 14 mmHg (L).
Fundus: Corrugated retinal surface, vitreous pigment cells (Shafer's sign).`,
    q:"What is the most likely diagnosis?",
    opts:["Vitreous haemorrhage","Rhegmatogenous retinal detachment","Central retinal artery occlusion","Acute angle-closure glaucoma"],
    ans:1,
    fb:"Rhegmatogenous RD is the diagnosis. Shafer's sign (tobacco dust = pigment cells in vitreous) is pathognomonic. The corrugated retinal surface confirms sensory retina elevation from the RPE due to liquefied vitreous entering through a retinal break. Surgical urgency: macula-off RD requires same-day/next-day intervention."
  },
  {
    hx:`CC: 45 y/o F, progressive loss of peripheral vision. Denies pain.
VA: 6/6 bilaterally.
IOP: 26 mmHg bilateral.
Disc: CDR 0.8 bilaterally, cup asymmetry.
Humphrey VF: Superior arcuate scotoma right eye.`,
    q:"The trabecular meshwork pathology here primarily affects which aqueous drainage route?",
    opts:["Uveoscleral outflow","Conventional (trabecular) outflow","Episcleral venous pressure","Ciliary epithelium secretion"],
    ans:1,
    fb:"Primary open angle glaucoma involves resistance at the juxtacanalicular trabecular meshwork (JCT), impairing conventional aqueous outflow to Schlemm's canal → collector channels → aqueous veins. This raises IOP progressively, causing RGC axon loss at the lamina cribrosa — the anatomical basis of arcuate scotoma mapping to the nerve fibre layer."
  },
  {
    hx:`CC: 30 y/o M, sudden onset severe periorbital pain, diplopia, proptosis after sinus infection.
Temp: 38.8°C.
Exam: Proptosis 5mm, restricted EOM in all directions, chemosis, relative afferent pupillary defect (RAPD).`,
    q:"Which orbital wall is most likely breached, allowing spread from the ethmoid sinus?",
    opts:["Orbital roof (frontal bone)","Medial wall (lamina papyracea)","Lateral wall (zygomatic + sphenoid)","Orbital floor (maxilla)"],
    ans:1,
    fb:"The lamina papyracea (paper-thin medial orbital wall, formed by the ethmoid bone) is the thinnest orbital wall — as little as 0.5mm. It is the most common route for orbital cellulitis to spread from ethmoid sinusitis. RAPD here signals optic nerve compromise — this is a surgical emergency requiring IV antibiotics and likely drainage."
  },
  {
    hx:`CC: 28 y/o F, referred for optic disc swelling bilaterally.
VA: 6/9 bilaterally.
BMI: 38. On oral contraceptive pill.
Lumbar puncture: Opening pressure 28 cmH₂O.
MRI brain/MRV: Normal.`,
    q:"What mechanism causes the bilateral disc swelling in this presentation?",
    opts:["Optic neuritis (demyelination)","Raised intracranial pressure transmitted via perioptic subarachnoid space","Central retinal vein occlusion","Leber hereditary optic neuropathy"],
    ans:1,
    fb:"Idiopathic intracranial hypertension (IIH / pseudotumor cerebri). Raised ICP is transmitted directly along the perioptic subarachnoid space to the optic nerve head, impairing axoplasmic flow and causing papilledema (true disc swelling). Risk factors: female, obese, OCP. The optic canal and perioptic meningeal sheaths form the anatomical conduit for this pressure transmission."
  },
];

// ─── STATE ───────────────────────────────────────────────────────────────────
let mode = 'anatomy';
let activeSection = 'orbit';
let activeSurgical = 'phaco';
let activeDisease = 'corneal';
let caseIdx = 0;
let caseAnswered = false;
let selectedLayer = null;

// ─── RENDER ──────────────────────────────────────────────────────────────────
function setMode(m){
  mode = m;
  ['anatomy','surgical','disease','clinical'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===m);
  });
  if(m==='anatomy') activeSection='orbit';
  if(m==='surgical') activeSurgical='phaco';
  if(m==='disease') activeDisease='corneal';
  renderAll();
}

function renderAll(){
  renderSidebar();
  renderContent();
}

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  if(mode==='anatomy'){
    sb.innerHTML = `<div class="nav-section"><div class="nav-label">Systems</div>` +
      ANATOMY_SECTIONS.map(s=>`
        <div class="nav-item${activeSection===s.id?' active':''}" onclick="selectSection('${s.id}')">
          <span class="nav-dot"></span>${s.label}
        </div>`).join('')+`</div>`;
  } else if(mode==='surgical'){
    sb.innerHTML = `<div class="nav-section"><div class="nav-label">Procedures</div>` +
      SURGICAL_SECTIONS.map(s=>`
        <div class="nav-item${activeSurgical===s.id?' active':''}" onclick="selectSurgical('${s.id}')">
          <span class="nav-dot"></span>${s.label}
        </div>`).join('')+`</div>`;
  } else if(mode==='disease'){
    sb.innerHTML = `<div class="nav-section"><div class="nav-label">Categories</div>` +
      DISEASE_SECTIONS.map(s=>`
        <div class="nav-item${activeDisease===s.id?' active':''}" onclick="selectDisease('${s.id}')">
          <span class="nav-dot"></span>${s.label}
        </div>`).join('')+`</div>`;
  } else {
    sb.innerHTML = `<div class="nav-section"><div class="nav-label">Cases</div>` +
      CLINICAL_CASES.map((c,i)=>`
        <div class="nav-item${caseIdx===i?' active':''}" onclick="selectCase(${i})">
          <span class="nav-dot"></span>Case ${i+1}
        </div>`).join('')+`</div>`;
  }
}

function selectSection(id){activeSection=id;selectedLayer=null;renderAll();}
function selectSurgical(id){activeSurgical=id;renderAll();}
function selectDisease(id){activeDisease=id;renderAll();}
function selectCase(i){caseIdx=i;caseAnswered=false;renderAll();}

function renderContent(){
  const ca = document.getElementById('content-area');
  if(mode==='anatomy') ca.innerHTML = renderAnatomy();
  else if(mode==='surgical') ca.innerHTML = renderSurgical();
  else if(mode==='disease') ca.innerHTML = renderDisease();
  else ca.innerHTML = renderClinical();
}

// ─── ANATOMY PANELS ──────────────────────────────────────────────────────────
function renderAnatomy(){
  const s = activeSection;
  if(s==='orbit') return renderOrbit();
  if(s==='eyeball') return renderEyeball();
  if(s==='anterior') return renderAnterior();
  if(s==='posterior') return renderPosterior();
  if(s==='adnexa') return renderAdnexa();
  if(s==='eom') return renderEOM();
  if(s==='nerves') return renderNerves();
  if(s==='pathway') return renderPathway();
  return '';
}

function renderOrbit(){
  return `<div class="panel">
  <div class="panel-title">Bony Orbit</div>
  <div class="panel-sub">7-bone pyramidal cavity — Wolff Ch. 1 | Volume ~30 mL | Axis 45° lateral to sagittal plane</div>
  <div class="eye-stage">
    <div class="eye-svg-wrap">${orbitSVG()}</div>
    <div class="info-card">
      <h3>Orbital Bones</h3>
      <div class="struct-grid">
        ${[
          {t:'Frontal',d:'Forms roof + part of lateral wall. Contains lacrimal fossa (superomedial).'},
          {t:'Zygomatic',d:'Lateral wall (strongest). Separates orbit from temporal fossa.'},
          {t:'Maxilla',d:'Floor & medial wall. Roof of maxillary sinus — floor fractures common.'},
          {t:'Sphenoid',d:'Greater + lesser wings. Contains optic canal, SOF. Apex bone.'},
          {t:'Ethmoid',d:'Lamina papyracea — thinnest wall (0.2–0.4 mm). Medial wall.'},
          {t:'Lacrimal',d:'Medial wall + lacrimal sac fossa (with maxilla). Anterior ethmoidal cells.'},
          {t:'Palatine',d:'Small contribution to orbital floor and medial wall, posteriorly.'},
        ].map(b=>`<div class="struct-card"><div class="struct-card-title">${b.t}</div><div class="struct-card-body">${b.d}</div></div>`).join('')}
      </div>
      <h3 style="margin-top:16px">Key Foramina</h3>
      <div class="layer-stack">
        ${[
          {n:'Optic canal',c:'#a78bfa',d:'CN II + ophthalmic artery. Lesser wing of sphenoid. ~5 mm long.'},
          {n:'Superior orbital fissure',c:'#4da8ff',d:'CN III, IV, V1 branches, CN VI, superior ophthalmic vein.'},
          {n:'Inferior orbital fissure',c:'#00d4aa',d:'CN V2 (infraorbital), zygomatic nerve, inferior ophthalmic vein.'},
          {n:'Anterior ethmoidal',c:'#f5a623',d:'Anterior ethmoidal nerve & artery → anterior cranial fossa.'},
          {n:'Posterior ethmoidal',c:'#e84545',d:'Posterior ethmoidal nerve & artery → ethmoid sinuses.'},
          {n:'Supraorbital notch',c:'#4ade80',d:'Supraorbital nerve (V1) + artery → forehead.'},
        ].map(r=>`<div class="layer-row">
          <div class="layer-color" style="background:${r.c}"></div>
          <div class="layer-name" style="color:${r.c};font-size:12px">${r.n}</div>
          <div class="layer-detail">${r.d}</div>
        </div>`).join('')}
      </div>
      <h3 style="margin-top:14px">Surgical Danger Zones</h3>
      <p style="font-size:12px;color:var(--text2)">
        <span class="badge badge-red">RISK</span> Medial wall (lamina papyracea) — penetration → ethmoid sinusitis, orbital haemorrhage<br>
        <span class="badge badge-red">RISK</span> Orbital floor — blowout fracture, inferior rectus entrapment, infraorbital nerve palsy<br>
        <span class="badge badge-amber">WARN</span> Optic canal region — excessive traction during orbital apex surgery risks CN II injury<br>
        <span class="badge badge-amber">WARN</span> SOF — pressure/haematoma compresses CN III/IV/VI → ophthalmoplegia
      </p>
    </div>
  </div>
  </div>`;
}

function orbitSVG(){
  return `<svg width="280" height="280" viewBox="0 0 280 280">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5a7a99" stroke-width="1.5"/></marker></defs>
  <!-- Outer bony orbit -->
  <ellipse cx="140" cy="130" rx="105" ry="95" fill="none" stroke="#3a5070" stroke-width="1.5"/>
  <!-- Frontal (roof) -->
  <path d="M60,70 Q140,30 220,70" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="50" text-anchor="middle" font-size="10" fill="#a78bfa" font-family="Space Mono">FRONTAL</text>
  <!-- Lateral (zygomatic) -->
  <path d="M220,70 Q245,130 215,195" fill="none" stroke="#4da8ff" stroke-width="3" stroke-linecap="round"/>

function renderEyeball(){

    {n:'Corneal stroma',c:'#89d4ff',d:'90% corneal thickness (~500 μm). Hydrated collagen lamellae (Type I). Keratocytes between lamellae. Transparency due to regular lattice spacing.',tag:'FIBROUS'},
    {n:"Descemet's membrane",c:'#a8dcff',d:"Basement membrane of endothelium. Thickens with age (3→10 μm). Detachment = Descemet's detachment (surgical complication).",tag:'FIBROUS'},
    {n:'Endothelium',c:'#c2e8ff',d:'Single layer of hexagonal cells. Pump function (Na-K ATPase). 2,500–3,000 cells/mm². Non-regenerating — loss = corneal oedema.',tag:'FIBROUS'},

  'lens-d':{label:'Lens Disease',items:[
    {n:'Nuclear sclerosis cataract',cat:'Age-related',d:'Hardening + yellowing of nucleus. Progressive myopic shift (index myopia). Brunescent nucleus = grade IV. Most common adult cataract worldwide.',layers:['Nuclear pigmentation','Cortical sparing (early)'],rx:'Phacoemulsification with IOL. Higher phaco energy for hard nuclei.'},
    {n:'Posterior subcapsular cataract',cat:'Age-related / Steroid',d:'Posterior cortex beneath posterior capsule. Disproportionate vision loss (affects axial ray). Associated with steroid use, diabetes, uveitis, radiation.',layers:['PSC plaque','Posterior capsule'],rx:'Phacoemulsification. Capsule polish important to prevent PCO recurrence.'},
    {n:'Posterior capsule opacification',cat:'Post-surgical',d:'Lens epithelial cell migration onto posterior capsule (Elschnig pearls). Weeks to years post phaco. Most common complication of cataract surgery.',layers:['LEC migration','Posterior capsule opacification'],rx:'Nd:YAG laser capsulotomy (safe, outpatient). Posterior capsule tears → floaters/RD risk.'},
    {n:'Subluxated lens (Ectopia lentis)',cat:'Structural',d:'Partial zonular disruption. Marfan (superior subluxation), homocystinuria (inferior), trauma (any direction). Phacodonesis (trembling lens).',layers:['Zonular weakness','Lens displacement','Vitreous prolapse (severe)'],rx:'Observation if mild. Aphakia correction. ACIOL/iris claw if severe.'},
  ]},
  'glaucoma':{label:'Glaucoma',items:[
    {n:'Primary open angle glaucoma',cat:'Chronic',d:'Commonest form. JCT resistance → raised IOP → RGC axonal loss at lamina cribrosa. Silent until advanced loss. Superior arcuate scotoma → nasal step → central island.',layers:['JCT resistance (site)','Lamina cribrosa (axon damage)','NFL thinning','GCL loss (OCT)'],rx:'Prostaglandin analogues (uveoscleral outflow ↑). SLT. Trabeculectomy. MIGS.'},
    {n:'Acute angle-closure glaucoma',cat:'Acute',d:'Pupillary block → iris bombs forward → closes angle. IOP suddenly >40–50 mmHg. Halos, severe pain, N&V, corneal oedema, fixed mid-dilated pupil.',layers:['Pupillary block','Angle closure','Corneal oedema','Optic nerve ischaemia (acute)'],rx:'IV acetazolamide + pilocarpine + timolol → laser peripheral iridotomy (LPI) → fellow eye LPI prophylaxis.'},
    {n:'Normal tension glaucoma',cat:'Pressure-independent',d:'Glaucomatous damage at IOP ≤21 mmHg. Vascular (systemic hypotension, Raynaud, migraine) + mechanical factors. Disc haemorrhages common.',layers:['Optic nerve susceptibility','Vascular insufficiency','Lamina cribrosa deformation'],rx:'IOP-lowering (evidence for 30% reduction). Neuroprotection (investigational). Vascular optimisation.'},
    {n:'Pseudoexfoliation glaucoma',cat:'Secondary open angle',d:'Fibrillar grey material deposited on lens, zonules, TM. Classic dandruff-like pattern on anterior lens capsule. Higher IOP, more rapid progression. Zonular weakness → phaco complications.',layers:['PXF material on TM (resistance)','Zonular weakness','Capsular PXF deposits'],rx:'Prostaglandins. Phaco with CTR for zonular laxity. Trabeculectomy if uncontrolled.'},
  ]},
  'retinal':{label:'Retinal Disease',items:[
    {n:'Diabetic retinopathy (PDR)',cat:'Vascular',d:'Proliferative DR: NVD (neovascularisation of disc) + NVE → vitreous haemorrhage → tractional RD. Driven by VEGF from ischaemic retina (peripheral non-perfusion).',layers:['Pericyte loss (early)','Microaneurysm','Hard exudate (BRB breakdown)','NVE → fibrovascular membrane','Tractional RD (late)'],rx:'Pan-retinal photocoagulation (PRP) → anti-VEGF → vitrectomy for tractional RD or VH.'},
    {n:'Rhegmatogenous retinal detachment',cat:'Structural',d:'Retinal break → liquefied vitreous under retina → sensory retina lifts from RPE. Risk factors: myopia, trauma, lattice degeneration. Bullous detachment, tobacco-dust cells (Shafer), RAPD if extensive.',layers:['Retinal break (horse-shoe or hole)','Subretinal fluid','Sensory retina elevation','Photoreceptor loss (if macula off)'],rx:'Scleral buckle / PPV + laser + gas/oil tamponade. Macular-off: urgent surgery.'},
    {n:'Wet AMD (nAMD)',cat:'Degenerative',d:"Choroidal neovascularisation (CNV) through Bruch's membrane → subretinal/sub-RPE fluid, haemorrhage, lipid. Rapid central vision loss. VEGF-driven.",layers:["Bruch's membrane disruption",'RPE detachment','CNV membrane','Subretinal fluid/blood'],rx:'Anti-VEGF injections (ranibizumab, aflibercept, bevacizumab). T&E or PRN protocol.'},
    {n:'Central retinal artery occlusion',cat:'Vascular',d:'Sudden painless visual loss. Retinal whitening (ischaemic oedema) + cherry-red spot at fovea (choroidal perfusion visible through thin foveal retina). GCA must be excluded.',layers:['Inner retinal ischaemia (all layers)','NFL oedema','GCL necrosis','Cherry red spot (fovea)'],rx:'Emergency: ocular massage, AC paracentesis, IOP lowering. GCA: IV methylprednisolone. Thrombolysis (investigational).'},
  ]},
  'optic':{label:'Optic Nerve Disease',items:[
    {n:'Optic neuritis',cat:'Inflammatory',d:'Pain on eye movement (orbital part of nerve). Central scotoma, dyschromatopsia, RAPD. Unilateral. 50% associated with MS. MRI — periventricular plaques (Dawson fingers).',layers:['Demyelination of nerve fibres','Perioptic inflammation','Retrobulbar (MRI lesion)'],rx:'IV methylprednisolone (speeds recovery, no long-term benefit). DMT if MS risk high.'},
    {n:'Papilledema',cat:'Raised ICP',d:'True disc oedema from raised ICP transmitted via perioptic subarachnoid space. Bilateral, asymmetric OK. Obscurations, enlarged blind spot, peripheral constriction late. Paton lines (peripapillary choroidal folds).',layers:['Axoplasmic flow obstruction','Nerve fibre layer swelling','Paton lines','Subretinal fluid (severe)'],rx:'Treat cause (IIH: weight loss, acetazolamide). ONSF or LP shunt if vision threatened.'},
    {n:'Non-arteritic AION (NAION)',cat:'Vascular',d:'Segment disc infarction — small optic disc (disc at risk, cup:disc ratio <0.1). Altitudinal visual field loss on waking. Associated with nocturnal hypotension, apnoea.',layers:['Posterior ciliary artery territory infarct','Disc oedema (sectoral)','NFL loss (inferior or superior)'],rx:'No proven treatment. Treat vascular risk factors. Aspirin debated. Fellow eye risk ~15% over 5 years.'},
    {n:'Glaucomatous optic neuropathy',cat:'Pressure-related',d:'Progressive RGC loss and axonal dropout. Disc changes: vertical CDR enlargement, inferior/superior rim notching (ISNT rule violation), disc haemorrhages, bayonetting of vessels, baring of lamina.',layers:['Lamina cribrosa deformation','RGC axon compression','NFL loss (superior/inferior)','Rim loss (ISNT violation)'],rx:'IOP reduction (medical, laser, surgical). Neuroprotection investigational.'},
  ]},
};

function renderDisease(){
  const cat=DISEASES[activeDisease];
  return `<div class="panel">
  <div class="panel-title">${cat.label}</div>
  <div class="panel-sub">Anatomy-disease correlation | Affected layers | Progression pattern</div>
  <div class="disease-grid">
    ${cat.items.map(d=>`
      <div class="disease-card" onclick="toggleDisease(this)">
        <div class="disease-card-cat">${d.cat}</div>
        <div class="disease-card-name">${d.n}</div>
        <div class="disease-card-desc">${d.d}</div>
        <div style="margin-top:10px;display:none" class="disease-detail">
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;margin-bottom:6px">AFFECTED LAYERS</div>
          ${d.layers.map(l=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
            <div style="width:4px;height:4px;border-radius:50%;background:var(--red);flex-shrink:0"></div>
            <span style="font-size:12px;color:var(--text2)">${l}</span></div>`).join('')}
          <div style="margin-top:10px;font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;margin-bottom:4px">MANAGEMENT</div>
          <div style="font-size:12px;color:var(--teal)">${d.rx}</div>
        </div>
        <div style="margin-top:8px;font-size:11px;color:var(--text3);font-family:var(--mono)">↓ click to expand</div>
      </div>`).join('')}
  </div>
  </div>`;
}

function toggleDisease(el){
  const det=el.querySelector('.disease-detail');
  const hint=el.querySelector('div:last-child');
  const open=det.style.display==='none';
  det.style.display=open?'block':'none';
  hint.textContent=open?'↑ click to collapse':'↓ click to expand';
  el.classList.toggle('sel',open);
}

// ─── CLINICAL CASES ──────────────────────────────────────────────────────────
function renderClinical(){
  const c=CLINICAL_CASES[caseIdx];
  return `<div class="panel">
  <div class="panel-title">Clinical Case ${caseIdx+1} / ${CLINICAL_CASES.length}</div>
  <div class="panel-sub">Anatomy-based clinical reasoning — PG ophthalmology level</div>
  <div class="case-box">
    <div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;margin-bottom:8px">CLINICAL HISTORY</div>
    <div class="case-hx">${c.hx.split('\n').join('<br>')}</div>
    <div class="case-question">${c.q}</div>
    <div class="case-opts">
      ${c.opts.map((o,i)=>`
        <button class="case-opt${caseAnswered?(i===c.ans?' correct':' wrong'):''}" 
          onclick="${!caseAnswered?`answerCase(${i},${c.ans})`:''}">
          ${String.fromCharCode(65+i)}. ${o}
        </button>`).join('')}
    </div>
    <div id="case-feedback" style="display:${caseAnswered?'block':'none'}" 
      class="case-feedback ${caseAnswered?'feedback-correct':''}">
      <strong>Anatomical basis:</strong> ${c.fb}
    </div>
    ${caseAnswered?`<button class="next-btn" onclick="nextCase()">NEXT CASE →</button>`:''}
  </div>
  <div style="display:flex;gap:6px;margin-top:4px">
    ${CLINICAL_CASES.map((_,i)=>`<div style="width:28px;height:4px;border-radius:2px;background:${i===caseIdx?'var(--teal)':'var(--border)'}"></div>`).join('')}
  </div>
  </div>`;
}

function answerCase(chosen,correct){
  caseAnswered=true;
  renderContent();
  // Highlight correct/wrong
  const opts=document.querySelectorAll('.case-opt');
  opts.forEach((o,i)=>{
    if(i===correct) o.classList.add('correct');
    else if(i===chosen&&chosen!==correct) o.classList.add('wrong');
  });
  const fb=document.getElementById('case-feedback');
  if(fb){
    fb.style.display='block';
    fb.className='case-feedback '+(chosen===correct?'feedback-correct':'feedback-wrong');
  }
}

function nextCase(){
  caseIdx=(caseIdx+1)%CLINICAL_CASES.length;
  caseAnswered=false;
  renderAll();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.selLayer=selLayer;
window.selectSection=selectSection;
window.selectSurgical=selectSurgical;
window.selectDisease=selectDisease;
window.selectCase=selectCase;
window.answerCase=answerCase;
window.nextCase=nextCase;
window.toggleDisease=toggleDisease;
window.setMode=setMode;

renderAll();
</script>
</body>
</html>
